[package]
name = "trushell"
version = "0.1.0"
edition = "2021"
authors = ["TruFoundation <noreply@trufoundation.org>"]

[dependencies]
anyhow = "1.0"
crossterm = "0.27"
signal-hook = "0.3"
nix = "0.27"
once_cell = "1.20"
libc = "0.2"
nu-ansi-term = "0.50"
unicode-width = "0.1"
vte = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = "11"
wat = "1.0"

# tokenization / globbing
shlex = "1.1"
globset = "0.4"
shellexpand = "2.1"
# REPL line editing and persistent history
reedline = "0.10"
